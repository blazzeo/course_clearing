events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream rust_backend {
        server api:3001 max_fails=5 fail_timeout=5s;
    }

    # 1. Редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        listen [::]:80;
        server_name clearme.local www.clearme.local;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Основной HTTPS сервер
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name clearme.local www.clearme.local;

        # Пути к сертификатам mkcert внутри контейнера
        ssl_certificate     /etc/nginx/certs/clearme.local+3.pem;
        ssl_certificate_key /etc/nginx/certs/clearme.local+3-key.pem;

        # Безопасные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;

        root /usr/share/nginx/html;

        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Статика React SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Прокси на Rust API
        location /api/ {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Прокси на Solana Localnet
        location /solana {
            proxy_pass http://host.docker.internal:8899/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
    }
}
