events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream rust_backend {
        server api:3002 max_fails=5 fail_timeout=5s;
    }

    # 1. Редирект с HTTP (80) на HTTPS (443)
    server {
        listen 80;
        listen [::]:80;
        server_name clearme.local www.clearme.local;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Основной HTTPS сервер
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name clearme.local www.clearme.local;

        # Пути к сертификатам mkcert внутри контейнера
        ssl_certificate     /etc/nginx/certs/clearme.local+3.pem;
        ssl_certificate_key /etc/nginx/certs/clearme.local+3-key.pem;

        # Безопасные настройки SSL
        ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html;

        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Статика React SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Прокси на Rust API
        location /api/ {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

		location /solana {
            error_page 418 = @solana_websocket;
            
            if ($http_upgrade = "websocket") {
                return 418;
            }

            # Убрали слэш на конце, теперь Nginx пробросит оригинальный URI /solana
            proxy_pass http://host.docker.internal:8899;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Блок для обработки вебсокетов (СТРОГО без слэша после порта!)
        location @solana_websocket {
            # Было http://host.docker.internal:8900/, стало без слэша:
            proxy_pass http://host.docker.internal:8900;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
    }
}
