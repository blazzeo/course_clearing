services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: clearing
      POSTGRES_PASSWORD: clearing
      POSTGRES_DB: clearing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearing -d clearing"]
      interval: 2s # Сделали интервал чаще, чтобы быстрее проверять
      timeout: 2s
      retries: 10
    restart: unless-stopped
    profiles:
      - all
      - db
      - api
      - frontend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://host.docker.internal:8899}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-ws://host.docker.internal:8900}
      DATABASE_URL: ${DATABASE_URL:-postgres://clearing:clearing@postgres:5432/clearing}
      ADMIN_PUBKEY: ${ADMIN_PUBKEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://clearme.local}
      RUST_LOG: info
      PORT: 3002
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:3"
    profiles:
      - all
      - api

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOLANA_RPC_URL: /solana
    container_name: gateway
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    profiles:
      - all
      - frontend

volumes:
  postgres_data:
    driver: local
